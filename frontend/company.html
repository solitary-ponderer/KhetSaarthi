<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhetSaarthi | Company</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">
    <span class="logo-icon">🌾</span>
    <span class="logo-text"><span class="logo-crop">crop</span><span class="logo-sync">sync</span></span>
  </a>
</header>

<div class="dash-wrap">
  <a href="index.html" class="back-link">← Back to home</a>
  <h2>🏢 Company</h2>
  <p class="screen-sub">List your agricultural products so farmers can discover them alongside their crop recommendations.</p>

  <label class="field-label">Product name</label>
  <input type="text" class="field-input" placeholder="e.g. NPK Fertilizer 20-20-0">

  <label class="field-label">Category</label>
  <select class="field-input">
    <option>Seeds</option>
    <option>Fertilizer</option>
    <option>Pesticide</option>
    <option>Tools &amp; Equipment</option>
  </select>
  <label class="field-label">Price (₹)</label>
  <input type="number" class="field-input" placeholder="e.g. 850">

  <button class="action-btn" disabled>List product (coming soon)</button>
</div>

</body>
</html>
