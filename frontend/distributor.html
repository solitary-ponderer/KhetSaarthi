<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhetSaarthi | Distributor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">
    <span class="logo-icon">🌾</span>
    <span class="logo-text"><span class="logo-crop">crop</span><span class="logo-sync">sync</span></span>
  </a>
</header>

<div class="dash-wrap">
  <a href="index.html" class="back-link">← Back to home</a>
  <h2>🚚 Distributor</h2>
  <p class="screen-sub">Post your crop requirement and get matched with nearby farmers.</p>

  <label class="field-label">Crop required</label>
  <input type="text" class="field-input" placeholder="e.g. Rice">

  <label class="field-label">Quantity (tonnes)</label>
  <input type="number" class="field-input" placeholder="e.g. 10">

  <label class="field-label">Needed by</label>
  <input type="date" class="field-input">

  <button class="action-btn" disabled>Post requirement (coming soon)</button>
</div>

</body>
</html>
